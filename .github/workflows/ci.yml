name: Terraform CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Terraform Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Validate AWS VPC module
        working-directory: modules/aws-vpc
        run: |
          terraform init -backend=false
          terraform validate

      - name: Validate Azure VNet module
        working-directory: modules/azure-vnet
        run: |
          terraform init -backend=false
          terraform validate

      - name: Validate GCP Network module
        working-directory: modules/gcp-network
        run: |
          terraform init -backend=false
          terraform validate

  plan:
    name: Terraform Plan (AWS only)
    runs-on: ubuntu-latest
    needs: validate
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Terraform Init
        working-directory: environments/dev
        run: terraform init -backend=false

      - name: Terraform Plan (AWS only)
        working-directory: environments/dev
        run: |
          terraform plan \
            -target=module.aws_vpc \
            -var="gcp_project_id=my-gcp-project"
